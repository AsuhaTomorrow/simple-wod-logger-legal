<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WOD Logger — Legal</title>
    <style>
        :root {
            --bg: #fbfbf9;
            --surface: #ffffff;
            --ink: #1a1a1e;
            --ink-soft: #54545c;
            --line: #e6e5e0;
            --accent: #1f7a54;
            --accent-soft: #e7f2ec;
            --code: #f2f1ec;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f0f11;
                --surface: #17171a;
                --ink: #ececef;
                --ink-soft: #a2a2ac;
                --line: #2a2a2f;
                --accent: #54c98d;
                --accent-soft: #16241d;
                --code: #1e1e22;
            }
        }

        :root[data-theme="light"] {
            --bg: #fbfbf9;
            --surface: #ffffff;
            --ink: #1a1a1e;
            --ink-soft: #54545c;
            --line: #e6e5e0;
            --accent: #1f7a54;
            --accent-soft: #e7f2ec;
            --code: #f2f1ec;
        }

        :root[data-theme="dark"] {
            --bg: #0f0f11;
            --surface: #17171a;
            --ink: #ececef;
            --ink-soft: #a2a2ac;
            --line: #2a2a2f;
            --accent: #54c98d;
            --accent-soft: #16241d;
            --code: #1e1e22;
        }

        * {
            box-sizing: border-box
        }

        html {
            -webkit-text-size-adjust: 100%
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
            line-height: 1.85;
            font-size: 16.5px;
            letter-spacing: .01em;
        }

        .wrap {
            max-width: 720px;
            margin: 0 auto;
            padding: clamp(28px, 6vw, 64px) clamp(20px, 5vw, 32px) 96px
        }

        header {
            border-bottom: 1px solid var(--line);
            padding-bottom: 28px;
            margin-bottom: 8px
        }

        .eyebrow {
            font-size: .78rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 700;
            margin: 0 0 10px
        }

        h1 {
            font-size: clamp(1.7rem, 5vw, 2.3rem);
            line-height: 1.3;
            margin: 0 0 14px;
            letter-spacing: .01em;
            text-wrap: balance
        }

        .lead {
            color: var(--ink-soft);
            font-size: 1.02rem;
            margin: 26px 0 6px
        }

        a {
            color: var(--accent);
            text-underline-offset: 3px;
            text-decoration-thickness: 1px
        }

        .docs {
            list-style: none;
            margin: 28px 0 0;
            padding: 0
        }

        .docs li {
            margin: 0 0 14px
        }

        .docs a {
            display: block;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px 22px;
            text-decoration: none;
            color: var(--ink)
        }

        .docs a:hover {
            border-color: var(--accent)
        }

        .docs .title {
            font-weight: 700;
            color: var(--accent)
        }

        .docs .desc {
            display: block;
            color: var(--ink-soft);
            font-size: .92rem
        }

        footer {
            margin-top: 56px;
            padding-top: 22px;
            border-top: 1px solid var(--line);
            color: var(--ink-soft);
            font-size: .88rem
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <p class="eyebrow">Legal</p>
            <h1>WOD Logger</h1>
        </header>

        <p class="lead">
            iOS アプリ「WOD Logger」の法務関連ドキュメントを掲載しています。
        </p>

        <ul class="docs">
            <li>
                <a href="privacy/">
                    <span class="title">プライバシーポリシー</span>
                    <span class="desc">本アプリにおける情報の取り扱いについて（日本語）</span>
                </a>
            </li>
            <li>
                <a href="privacy/en/">
                    <span class="title">Privacy Policy</span>
                    <span class="desc">How we handle your information in the App (English)</span>
                </a>
            </li>
        </ul>

        <footer>
            <p>WOD Logger</p>
        </footer>
    </div>
</body>

</html>
